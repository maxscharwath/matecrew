[package]
name = "device-engine"
version = "0.1.0"
edition = "2021"
description = "Portable TSX bytecode, declarative hooks and monochrome device UI rendering"
readme = "README.md"

[dependencies]
embedded-graphics = "0.8"
u8g2-fonts = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcodegen = "1.8"
png = "0.18.1"
# Already in the tree through png/flate2: inflates DUIZ (compressed) bytecode.
miniz_oxide = "0.9"
