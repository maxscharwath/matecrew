[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; The S3 native USB does not take the default DTR/RTS reset reliably.
board_upload.before_reset = usb_reset
upload_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  zinggjm/GxEPD2@^1.6.4
