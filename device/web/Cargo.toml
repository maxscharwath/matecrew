[package]
name = "matecrew-web"
version = "0.1.0"
edition = "2021"
description = "The terminal's screens and take flow, compiled to WebAssembly for the virtual device on the site."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
matecrew-core = { path = "../core" }
matecrew-ui = { path = "../ui" }
embedded-graphics = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
