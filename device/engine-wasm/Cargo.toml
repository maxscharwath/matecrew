[package]
name = "device-engine-wasm"
version = "0.1.0"
edition = "2021"
description = "The device engine alone, compiled to WebAssembly for the SDK: render a scene in a given state to 1-bit pixels."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
device-engine = { path = "../engine" }
device-board = { path = "../board" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
