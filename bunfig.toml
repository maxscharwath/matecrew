# The Prisma client imports its query compiler the workerd way; see the plugin.
preload = ["./scripts/bun/wasm-module.ts"]

[test]
preload = ["./scripts/bun/wasm-module.ts"]

[install]
# One copy of each package, linked where it is used, as Bun has done by default for workspaces
# since 1.3: said here so every Bun installs the same tree. A flat node_modules let Next trace
# packages the Worker never runs (MediaPipe, PGlite, Prisma's CLI) into it, past Workers' 64 MiB.
# Workers Builds needs BUN_VERSION=1.4.2: its default Bun, 1.2.15, installs a flat tree.
linker = "isolated"
